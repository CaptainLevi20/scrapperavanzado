services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  minio:
    # Docker Hub niega la descarga anónima de minio/minio (verificado
    # 2026-09-15) y su espejo quay.io/minio/minio también (401 Unauthorized,
    # verificado 2026-09-28). cgr.dev/chainguard/minio sigue siendo pública;
    # corre por defecto con un usuario sin permisos sobre /data (los datos
    # existentes son de root), por eso user "0:0". Probado 2026-09-28 sobre una
    # copia de los datos reales: lee todo igual, y la imagen anterior vuelve a
    # leer los datos después (se puede revertir).
    image: cgr.dev/chainguard/minio:latest
    user: "0:0"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - minio_data:/data
    restart: unless-stopped

  api:
    image: ghcr.io/captainlevi20/scrapperavanzado-api:latest
    env_file: .env.production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
    # Carpeta de la máquina servidor donde el Laboratorio > "Decretos Cali" deja
    # los PDF. CALI_DESCARGAS_DIR (en .env.production) decide qué carpeta real
    # queda detrás; por defecto ./descargas, junto a este archivo. Tiene que
    # estar montada IGUAL en api y worker: el worker escribe los PDF, la api
    # valida la ruta y sirve el progreso.
    volumes:
      - "${CALI_DESCARGAS_DIR:-./descargas}:/descargas"
    restart: unless-stopped

  worker:
    image: ghcr.io/captainlevi20/scrapperavanzado-worker:latest
    env_file: .env.production
    environment:
      CLAMAV_HOST: clamav
    depends_on:
      clamav:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
    volumes:
      - "${CALI_DESCARGAS_DIR:-./descargas}:/descargas"
    restart: unless-stopped

  clamav:
    # Antivirus: cada archivo descargado se revisa aquí antes de guardarlo (ver
    # core/antivirus.py). La imagen oficial se configura con variables
    # CLAMD_CONF_*: por defecto solo revisa 25 MB por la red (StreamMaxLength) y
    # deja pasar sin aviso lo más grande, así que se sube por encima del tope de
    # descargas (MAX_DOWNLOAD_MB=300). ConcurrentDatabaseReload=no evita que la
    # memoria se duplique (~2 GB) al actualizar firmas: pausa la revisión unos
    # segundos en su lugar. Medido 2026-11-05: ~1,1 GB en uso normal.
    # El volumen guarda las firmas: sin él, cada reinicio las vuelve a bajar
    # (~300 MB) y el servidor de firmas bloquea descargas repetidas.
    image: clamav/clamav:stable
    environment:
      CLAMD_CONF_StreamMaxLength: 310M
      CLAMD_CONF_MaxFileSize: 310M
      CLAMD_CONF_MaxScanSize: 1000M
      CLAMD_CONF_ConcurrentDatabaseReload: "no"
      CLAMD_CONF_AlertExceedsMax: "yes"
      # 5 min por archivo (por defecto 2): con otra fuente grande descargando a
      # la vez, 9 laudos de la CCB no alcanzaron a revisarse (5-nov-2026).
      CLAMD_CONF_MaxScanTime: "300000"
    volumes:
      - clamav_db:/var/lib/clamav
    mem_limit: 2500m
    restart: unless-stopped

  beat:
    image: ghcr.io/captainlevi20/scrapperavanzado-beat:latest
    env_file: .env.production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  frontend:
    image: ghcr.io/captainlevi20/scrapperavanzado-frontend:latest
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    environment:
      CADDY_DOMAIN: ${CADDY_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      # Descarga de documentos desde el navegador (proxy a MinIO).
      - "9443:9443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - api
      - frontend
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
  caddy_data:
  clamav_db:
