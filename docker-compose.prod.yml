services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - iurisync_prod_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - iurisync_prod_redis:/data

  minio:
    image: minio/minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - iurisync_prod_minio:/data

  api:
    image: ghcr.io/captainlevi20/scrapperavanzado-api:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # Absolute path: this compose file gets checked out fresh into a different
    # folder on every deploy, but the real secrets live outside that checkout
    # (see the deploy job) so they survive actions/checkout's cleanup.
    env_file: C:/iurisync-deploy/.env.production
    ports:
      - "8000:8000"

  worker:
    image: ghcr.io/captainlevi20/scrapperavanzado-worker:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: C:/iurisync-deploy/.env.production

  beat:
    image: ghcr.io/captainlevi20/scrapperavanzado-beat:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: C:/iurisync-deploy/.env.production

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    restart: unless-stopped
    ports:
      - "80:80"

volumes:
  iurisync_prod_postgres:
  iurisync_prod_redis:
  iurisync_prod_minio:
