services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: iurisync
      POSTGRES_PASSWORD: iurisync
      POSTGRES_DB: iurisync
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
  minio:
    # Docker Hub niega la descarga anónima de minio/minio ("pull access
    # denied ... repository does not exist or may require 'docker login'",
    # verificado 2026-09-15 descargándola directamente) — quay.io/minio/minio
    # es el espejo que la propia MinIO sigue publicando en abierto.
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:
