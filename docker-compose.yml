services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: iurisync
      POSTGRES_PASSWORD: iurisync
      POSTGRES_DB: iurisync
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
  minio:
    # Docker Hub niega la descarga anónima de minio/minio (verificado
    # 2026-09-15) y su espejo quay.io/minio/minio también (401 Unauthorized,
    # verificado 2026-09-28). cgr.dev/chainguard/minio sigue siendo pública;
    # corre por defecto con un usuario sin permisos sobre /data (los datos
    # existentes son de root), por eso user "0:0". Probado 2026-09-28 sobre una
    # copia de los datos reales: lee todo igual, y la imagen anterior vuelve a
    # leer los datos después (se puede revertir).
    image: cgr.dev/chainguard/minio:latest
    user: "0:0"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:
