name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: iurisync
          POSTGRES_PASSWORD: iurisync
          POSTGRES_DB: iurisync_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U iurisync"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 -p 9001:9001 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio server /data --console-address ":9001"
          sleep 5
      - name: Run migrations
        env:
          DATABASE_URL: postgresql+psycopg://iurisync:iurisync@localhost:5432/iurisync_test
        run: alembic upgrade head
      - name: Run tests
        env:
          TEST_DATABASE_URL: postgresql+psycopg://iurisync:iurisync@localhost:5432/iurisync_test
          TEST_S3_ENDPOINT_URL: http://localhost:9000
        run: pytest -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Run tests
        run: npm test
      - name: Type-check and build
        run: npm run build

  docker:
    name: Build and push (${{ matrix.target }})
    runs-on: ubuntu-latest
    needs: [test, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        target: [api, worker, beat]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          tags: |
            ghcr.io/captainlevi20/scrapperavanzado-${{ matrix.target }}:latest
            ghcr.io/captainlevi20/scrapperavanzado-${{ matrix.target }}:${{ github.sha }}
          cache-from: type=gha,scope=docker-${{ matrix.target }}
          cache-to: type=gha,scope=docker-${{ matrix.target }},mode=max

  deploy:
    name: Deploy to office PC
    runs-on: [self-hosted, office]
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull latest backend images
        run: docker compose --env-file C:/iurisync-deploy/.env.production -f docker-compose.prod.yml pull postgres redis minio api worker beat
      - name: Build frontend image
        run: docker compose --env-file C:/iurisync-deploy/.env.production -f docker-compose.prod.yml build frontend
      - name: Apply database migrations
        run: docker compose --env-file C:/iurisync-deploy/.env.production -f docker-compose.prod.yml run --rm api alembic upgrade head
      - name: Restart services
        run: docker compose --env-file C:/iurisync-deploy/.env.production -f docker-compose.prod.yml up -d
