server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Client-side routing (React Router): unknown paths fall back to index.html
    # instead of nginx's default 404, since the app itself decides what to render.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
